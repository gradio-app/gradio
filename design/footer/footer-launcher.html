<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footer Launcher</title>
    <!--
  Option E for the Gradio 7 footer (#13915, #13916): a corner launcher that
  expands upwards and shows the session's running events (#13585).
  Same conventions as footer-options.html: static HTML, default theme tokens.
  The boards are generated by the script at the bottom of the file.
-->
    <style>
      @font-face {
        font-family: "Source Sans Pro";
        font-weight: 400;
        src: url("../../js/spa/public/static/fonts/Source Sans Pro/SourceSansPro-Regular.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Source Sans Pro";
        font-weight: 600 700;
        src: url("../../js/spa/public/static/fonts/Source Sans Pro/SourceSansPro-Bold.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../../js/spa/public/static/fonts/IBMPlexMono/IBMPlexMono-Regular.woff2")
          format("woff2");
      }

      /* Gradio's default theme: orange primary on zinc neutrals. */
      .theme {
        --bg: #ffffff;
        --block: #ffffff;
        --block-border: #e4e4e7;
        --label: #71717a;
        --text: #27272a;
        --text-strong: #18181b;
        --subdued: #71717a;
        --faint: #a1a1aa;
        --hairline: #e4e4e7;
        --chip: #f4f4f5;
        --chip-hover: #e4e4e7;
        --accent: #f97316;
        --accent-strong: #ea580c;
        --accent-soft: #fff7ed;
        --accent-line: #ffddb3;
        --ok: #16a34a;
        --ok-soft: #f0fdf4;
        --err: #dc2626;
        --code-bg: #fafafa;
        --code-text: #3f3f46;
        --tok-key: #c2410c;
        --tok-str: #15803d;
        --tok-fn: #1d4ed8;
        --panel: #ffffff;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -6px rgba(24, 24, 27, 0.16);
        --scrim: rgba(24, 24, 27, 0.28);
        color: var(--text);
        background: var(--bg);
      }
      .theme.dark {
        --bg: #0f0f11;
        --block: #18181b;
        --block-border: #3f3f46;
        --label: #a1a1aa;
        --text: #e4e4e7;
        --text-strong: #fafafa;
        --subdued: #a1a1aa;
        --faint: #71717a;
        --hairline: #2e2e33;
        --chip: #27272a;
        --chip-hover: #3f3f46;
        --accent: #f97316;
        --accent-strong: #fb923c;
        --accent-soft: rgba(249, 115, 22, 0.12);
        --accent-line: rgba(249, 115, 22, 0.35);
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.1);
        --err: #f87171;
        --code-bg: #0f0f11;
        --code-text: #d4d4d8;
        --tok-key: #fdba74;
        --tok-str: #86efac;
        --tok-fn: #93c5fd;
        --panel: #1c1c1f;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -8px rgba(0, 0, 0, 0.7);
        --scrim: rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9e9ec;
        font-family: "Source Sans Pro", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      code,
      pre,
      .mono {
        font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      }

      /* ---------- board ---------- */
      .board {
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #f4f4f5;
        width: max-content;
      }
      .board.dark-board {
        background: #09090b;
      }
      .board-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .board-head .tag {
        font:
          600 13px/1 "IBM Plex Mono",
          monospace;
        color: #f97316;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .board-head h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        color: #18181b;
      }
      .board-head p {
        margin: 0;
        color: #71717a;
        font-size: 16px;
      }
      .dark-board .board-head h2 {
        color: #fafafa;
      }
      .dark-board .board-head p {
        color: #a1a1aa;
      }
      .states {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .state {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .state-label {
        font:
          600 12px/1 "IBM Plex Mono",
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #71717a;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .state-label b {
        color: #18181b;
        font-weight: 600;
      }
      .dark-board .state-label b {
        color: #fafafa;
      }
      .state-note {
        width: 560px;
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
        color: #71717a;
      }
      .dark-board .state-note {
        color: #a1a1aa;
      }

      /* ---------- mock app window ---------- */
      .window {
        width: 560px;
        height: 540px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        border: 1px solid #d4d4d8;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
      }
      .window.dark {
        border-color: #27272a;
      }
      .window.phone {
        width: 300px;
      }
      .chrome {
        height: 30px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        background: var(--chip);
        border-bottom: 1px solid var(--hairline);
      }
      .chrome i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--chip-hover);
        display: block;
      }
      .chrome .url {
        margin-left: 10px;
        flex: 1;
        height: 18px;
        border-radius: 5px;
        background: var(--bg);
        font:
          11px/18px "IBM Plex Mono",
          monospace;
        color: var(--faint);
        padding: 0 8px;
      }
      .app {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 18px 20px 0;
        position: relative;
        min-height: 0;
      }
      .app h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-strong);
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .phone .app > .row {
        flex-direction: column;
      }
      .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .blk {
        border: 1px solid var(--block-border);
        border-radius: 8px;
        background: var(--block);
        padding: 8px 10px 10px;
      }
      .blk .lbl {
        font-size: 12px;
        color: var(--label);
        margin-bottom: 5px;
      }
      .blk .val {
        font-size: 14px;
        color: var(--text);
        min-height: 20px;
      }
      .btn {
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        padding: 7px 0;
      }
      .btn.primary {
        background: linear-gradient(to bottom right, #fb923c, #f97316);
        color: #fff;
      }
      .btn.secondary {
        background: var(--chip);
        color: var(--text);
      }
      .video {
        height: 132px;
        border-radius: 6px;
        background: var(--chip);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        color: var(--subdued);
      }
      .phone .video {
        height: 96px;
      }
      .video.done {
        background: linear-gradient(135deg, #312e81, #be185d 60%, #f97316);
        color: #fff;
      }
      .video.done .play {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .video .bar {
        width: 60%;
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--chip-hover);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
      }

      /* A gr.Server page we don't control. */
      .custom {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: repeating-linear-gradient(
          135deg,
          #fafafa 0 10px,
          #f4f4f5 10px 20px
        );
        align-items: center;
        justify-content: center;
        font:
          12px "IBM Plex Mono",
          monospace;
        color: #a1a1aa;
      }

      /* ---------- shared bits ---------- */
      /* Stroke icons: <use> inherits these from the element that uses it. */
      .ico,
      .x-ico {
        width: 14px;
        height: 14px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo {
        width: 22px;
        height: 22px;
        flex: none;
      }
      .spin {
        width: 14px;
        height: 14px;
        flex: none;
        border-radius: 50%;
        background: conic-gradient(var(--accent) 0 32%, var(--accent-line) 0);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 2.5px),
          #000 calc(100% - 2px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 2.5px),
          #000 calc(100% - 2px)
        );
      }

      /* ================= E: the launcher ================= */
      .fab {
        position: absolute;
        right: 14px;
        bottom: 14px;
        height: 40px;
        min-width: 40px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }
      .fab.static {
        position: relative;
        right: auto;
        bottom: auto;
      }
      .fab.open {
        background: var(--chip);
        box-shadow: 0 0 0 1px var(--chip-hover);
      }
      .fab .x-ico {
        width: 16px;
        height: 16px;
        color: var(--subdued);
      }
      /* Progress ring: shown while anything in the session is running. */
      .fab .ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: conic-gradient(var(--accent) 0 32%, var(--accent-line) 0);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          #000 calc(100% - 2.5px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          #000 calc(100% - 2.5px)
        );
      }
      .fab .ring.idle {
        background: var(--chip-hover);
      }
      .fab .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font:
          700 11px/19px "Source Sans Pro",
          sans-serif;
        text-align: center;
        box-shadow: 0 0 0 2px var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fab .badge .ico {
        width: 11px;
        height: 11px;
      }
      .fab .badge.queued {
        background: var(--panel);
        color: var(--accent-strong);
        box-shadow:
          inset 0 0 0 1.5px var(--accent),
          0 0 0 2px var(--bg);
      }
      .fab .badge.done {
        background: var(--ok);
      }
      .dark .fab .badge.done {
        color: #052e16;
      }
      .fab .badge.err {
        background: var(--err);
      }
      .fab.off .logo {
        filter: grayscale(1);
        opacity: 0.45;
      }
      /* Peek: the circle grows sideways for a moment, then shrinks back. */
      .fab.peek {
        padding: 0 9px 0 14px;
        gap: 9px;
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
      }
      .fab.peek .msg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .fab.peek .msg code {
        font-size: 12px;
        color: var(--text-strong);
      }
      .fab.peek .msg .sub {
        color: var(--subdued);
      }
      .fab.peek .go {
        font-weight: 600;
        color: var(--accent-strong);
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .fab.peek .sep {
        width: 1px;
        height: 18px;
        background: var(--hairline);
      }
      .fab.peek.hot {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-strong);
        font-weight: 600;
      }
      .fab.peek.hot .msg code {
        color: inherit;
        font-weight: 400;
      }
      .fab.peek.hot .sep {
        background: var(--accent-line);
      }
      .ok {
        color: var(--ok);
      }

      /* ---------- the panel that expands upwards ---------- */
      .pop {
        position: absolute;
        right: 14px;
        bottom: 64px;
        width: 304px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        z-index: 2;
        font-size: 14px;
      }
      .pop.wide {
        width: 420px;
      }
      .pop .banner {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        font-size: 13px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        border-bottom: 1px solid var(--accent-line);
      }
      .pop .banner.ok-b {
        background: var(--ok-soft);
        color: var(--ok);
        border-bottom-color: var(--hairline);
      }
      .sec {
        padding: 10px 12px 6px;
        border-bottom: 1px solid var(--hairline);
      }
      .sec-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font:
          600 11px/1 "IBM Plex Mono",
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--subdued);
        margin-bottom: 4px;
      }
      .sec-h .n {
        font:
          700 11px/16px "Source Sans Pro",
          sans-serif;
        letter-spacing: 0;
        min-width: 16px;
        padding: 0 4px;
        border-radius: 8px;
        text-align: center;
        background: var(--accent);
        color: #fff;
      }
      .sec-h .all {
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
        font:
          600 12px/1 "Source Sans Pro",
          sans-serif;
        color: var(--subdued);
      }
      .ev {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 7px 0;
      }
      .ev .st {
        margin-top: 2px;
        color: var(--faint);
        display: flex;
      }
      .ev .body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ev .l1 {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .ev .l1 code {
        font-size: 12.5px;
        color: var(--text-strong);
      }
      .ev .l1 .t {
        margin-left: auto;
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }
      .ev .l2 {
        font-size: 12.5px;
        color: var(--subdued);
      }
      .ev .act {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 1px solid var(--hairline);
        color: var(--subdued);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ev .act .ico {
        width: 10px;
        height: 10px;
      }
      .ev .view {
        flex: none;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent-strong);
        align-self: center;
      }
      .ev.err .l2 {
        color: var(--err);
      }
      .menu {
        padding: 5px;
        display: flex;
        flex-direction: column;
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 7px;
        color: var(--text);
      }
      .mi .ico {
        width: 15px;
        height: 15px;
        color: var(--subdued);
      }
      .mi .r {
        margin-left: auto;
        font-size: 12px;
        color: var(--faint);
      }
      .mi.hover {
        background: var(--chip);
      }
      .pop-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border-top: 1px solid var(--hairline);
        background: var(--code-bg);
        font-size: 12.5px;
        color: var(--subdued);
      }
      .pop-foot .logo {
        width: 15px;
        height: 15px;
      }
      .pop-foot .r {
        margin-left: auto;
        color: var(--faint);
      }

      /* "Last run" card: the #13916 entry point, inside the panel. */
      .last {
        margin: 10px 10px 0;
        padding: 10px;
        border-radius: 9px;
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent-line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .last .l1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--subdued);
      }
      .last .l1 code {
        font-size: 12.5px;
        color: var(--text-strong);
      }
      .last .ttl {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-strong);
      }
      .chips {
        display: flex;
        gap: 5px;
      }
      .chips span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--accent-line);
        color: var(--accent-strong);
      }

      /* Code view inside the panel. */
      .pop-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 0;
        font-weight: 700;
        color: var(--text-strong);
        font-size: 15px;
      }
      .pop-head .back {
        color: var(--subdued);
        display: flex;
      }
      .pop-head .x {
        margin-left: auto;
        color: var(--faint);
        font-weight: 400;
      }
      .pad {
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--subdued);
      }
      .meta code {
        font-size: 12px;
        color: var(--text-strong);
        background: var(--chip);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--chip);
        border-radius: 8px;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 6px;
        color: var(--subdued);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .tabs span.on {
        background: var(--panel);
        color: var(--text-strong);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      pre.code {
        margin: 0;
        padding: 12px 14px;
        background: var(--code-bg);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--code-text);
        white-space: pre;
        overflow: hidden;
        position: relative;
      }
      pre.code .k {
        color: var(--tok-key);
      }
      pre.code .s {
        color: var(--tok-str);
      }
      pre.code .f {
        color: var(--tok-fn);
      }
      .copy {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
        font:
          600 12px/1 "Source Sans Pro",
          sans-serif;
        color: var(--subdued);
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .panel-foot {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--subdued);
      }
      .panel-foot a {
        color: var(--accent-strong);
        font-weight: 600;
      }

      /* Phone: the same panel as a bottom sheet. */
      .scrim {
        position: absolute;
        inset: 30px 0 0;
        background: var(--scrim);
        z-index: 1;
      }
      .pop.sheet {
        right: 0;
        left: 0;
        bottom: 0;
        width: auto;
        border-radius: 16px 16px 0 0;
        border-width: 1px 0 0;
      }
      .pop.sheet::before {
        content: "";
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--chip-hover);
        align-self: center;
        margin-top: 7px;
      }

      /* ---------- launcher state tiles ---------- */
      .tiles {
        display: flex;
        gap: 14px;
      }
      .tile {
        width: 164px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tile .stage {
        height: 112px;
        border-radius: 12px;
        border: 1px solid #d4d4d8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile .stage .fab {
        transform: scale(1.35);
      }
      .tile b {
        display: block;
        font-size: 15px;
        color: #18181b;
      }
      .tile span {
        font-size: 13.5px;
        line-height: 1.35;
        color: #71717a;
      }
      /* ================= Launcher shapes =================
         The circle reads as a chat widget, so these swap its outline while
         keeping every state. Set with ?shape=squircle|tab|diamond, or a
         .shape-* class on any ancestor. The progress ring follows the shape. */
      .fab .ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        display: none;
      }
      .fab .ring path {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: none;
      }
      .fab .ring .t {
        stroke: var(--accent-line);
      }
      .fab .ring .p {
        stroke: var(--accent);
        stroke-dasharray: 32 100;
      }
      .fab .ring.idle .t {
        stroke: var(--chip-hover);
      }
      .fab .ring.idle .p {
        display: none !important;
      }
      .shape-squircle .fab .ring,
      .shape-diamond .fab .ring {
        background: none;
        -webkit-mask: none;
        mask: none;
        border-radius: 0;
      }
      .shape-squircle .fab .ring svg,
      .shape-diamond .fab .ring svg {
        display: block;
      }
      .shape-squircle .fab .ring .sq,
      .shape-diamond .fab .ring .dm {
        display: inline;
      }

      /* Rounded square: an app icon, not a chat bubble. */
      .shape-squircle .fab {
        border-radius: 12px;
      }

      /* Diamond: the rhombus of the Gradio mark. */
      .shape-diamond .fab:not(.peek) {
        background: none;
        border: 0;
        box-shadow: none;
        width: 44px;
        height: 44px;
      }
      .shape-diamond .fab:not(.peek)::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 7px;
        width: 30px;
        height: 30px;
        transform: rotate(45deg);
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        box-shadow: var(--shadow);
        z-index: -1;
      }
      .shape-diamond .fab.open::before {
        background: var(--chip);
      }
      .shape-diamond .fab .ring {
        inset: -2px;
      }
      .shape-diamond .fab:not(.peek) .badge {
        top: -3px;
        right: -3px;
      }
      .shape-diamond .fab.peek {
        border-radius: 12px;
      }
      .shape-diamond .pop {
        bottom: 68px;
      }

      /* Corner tab: docked into the corner, part of the page's frame. */
      .shape-tab .fab {
        right: 0;
        bottom: 0;
        height: 46px;
        min-width: 56px;
        border-radius: 12px 0 0 0;
        border-width: 1px 0 0 1px;
        box-shadow: -6px -6px 18px -10px rgba(24, 24, 27, 0.25);
      }
      .shape-tab .fab.peek {
        padding-right: 16px;
      }
      .shape-tab .fab .ring {
        inset: -1px 0 auto 11px;
        height: 3px;
        border-radius: 0 0 2px 2px;
        -webkit-mask: none;
        mask: none;
        background: linear-gradient(
          90deg,
          var(--accent) 0 32%,
          var(--accent-line) 0
        );
      }
      .shape-tab .fab .ring.idle {
        background: var(--chip-hover);
      }
      .shape-tab .fab .badge {
        right: auto;
        left: -8px;
        top: -8px;
      }
      .shape-tab .pop {
        right: 10px;
        bottom: 52px;
      }
      .shape-tab .tile .stage {
        align-items: flex-end;
        justify-content: flex-end;
        overflow: hidden;
      }
      .shape-tab .tile .stage .fab {
        transform: scale(1.35);
        transform-origin: 100% 100%;
      }

      /* ---------- shape comparison board ---------- */
      .shape-row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .shape-row .shape-name {
        width: 150px;
        flex: none;
        padding-top: 38px;
      }
      .shape-row .shape-name b {
        display: block;
        font-size: 16px;
        color: #18181b;
      }
      .shape-row .shape-name span {
        font-size: 13.5px;
        line-height: 1.35;
        color: #71717a;
      }
      .shape-row + .shape-row {
        padding-top: 18px;
        border-top: 1px solid #e4e4e7;
      }
    </style>
  </head>
  <body>
    <!-- ============ SVG icon sprite ============ -->
    <svg width="0" height="0" style="position: absolute">
      <defs>

    <div id="boards"></div>

    <script>
      // Every board below is described as data and rendered by these helpers,
      // so the launcher and panel markup exist once.
      const ico = (id, cls = "ico") =>
        `<svg class="${cls}"><use href="#${id}" /></svg>`;

      // ---- the mock app: a slow "video generator", so events take a while ----
      function app(state, phone) {
        const video = {
          idle: `<div class="video"></div>`,
          gen: `<div class="video"><span>Generating · step 21 of 50</span><div class="bar"><i style="width:42%"></i></div></div>`,
          done: `<div class="video done"><span class="play">${ico("play")}</span></div>`,
        }[state];
        return `<div class="app"><h1>Video generator</h1>
          <div class="row">
            <div class="col">
              <div class="blk"><div class="lbl">Prompt</div><div class="val">A jellyfish drifting through a neon city</div></div>
              ${phone ? "" : `<div class="blk"><div class="lbl">Length</div><div class="val">8 seconds</div></div>`}
              <div class="row"><div class="btn secondary col">Clear</div><div class="btn primary col">Generate</div></div>
            </div>
            <div class="col"><div class="blk"><div class="lbl">Video</div>${video}</div></div>
          </div></div>`;
      }
      const custom = `<div class="custom">your frontend</div>`;

      // ---- the launcher ----
      const BADGES = {
        queued: (n) => `<span class="badge queued">${n}</span>`,
        done: () => `<span class="badge done">${ico("check")}</span>`,
        err: () => `<span class="badge err">${ico("bang")}</span>`,
      };
      const RING = `<svg viewBox="0 0 48 48" preserveAspectRatio="none">${[
        "sq",
        "dm",
      ]
        .map((k) => {
          const d = {
            sq: "M24 1.5H31.5A15 15 0 0 1 46.5 16.5V31.5A15 15 0 0 1 31.5 46.5H16.5A15 15 0 0 1 1.5 31.5V16.5A15 15 0 0 1 16.5 1.5Z",
            dm: "M5 21L21 5Q24 2 27 5L43 21Q46 24 43 27L27 43Q24 46 21 43L5 27Q2 24 5 21Z",
          }[k];
          return `<path class="t ${k}" d="${d}" pathLength="100"/><path class="p ${k}" d="${d}" pathLength="100"/>`;
        })
        .join("")}</svg>`;
      function fab(o = {}) {
        const cls = ["fab"];
        if (o.static) cls.push("static");
        if (o.open) cls.push("open");
        if (o.off) cls.push("off");
        let inner = o.open ? ico("x", "x-ico") : ico("logo", "logo");
        if (o.peek) {
          cls.push("peek");
          if (o.peek.hot) cls.push("hot");
          inner = `<span class="msg">${o.peek.html}</span><span class="sep"></span>${ico("logo", "logo")}`;
        }
        if (o.ring && !o.peek) inner += `<span class="ring">${RING}</span>`;
        if (o.off) inner += `<span class="ring idle">${RING}</span>`;
        if (o.running) inner += `<span class="badge">${o.running}</span>`;
        else if (o.badge) inner += BADGES[o.badge](o.n);
        return `<div class="${cls.join(" ")}">${inner}</div>`;
      }

      // ---- panel pieces ----
      const EV = {
        generate: `<div class="ev"><span class="st"><span class="spin"></span></span>
          <div class="body"><div class="l1"><code>/generate</code><span class="t">1m 12s</span></div>
          <div class="l2">Step 21 of 50</div><div class="bar"><i style="width:42%"></i></div></div>
          <span class="act" title="Stop">${ico("stop")}</span></div>`,
        upscale: `<div class="ev"><span class="st">${ico("clock")}</span>
          <div class="body"><div class="l1"><code>/upscale</code><span class="t">~40s</span></div>
          <div class="l2">In queue · 2 of 5</div></div>
          <span class="act" title="Cancel">${ico("x")}</span></div>`,
        caption: `<div class="ev"><span class="st ok">${ico("check")}</span>
          <div class="body"><div class="l1"><code>/caption</code><span class="t">2 min ago</span></div></div>
          <span class="view">View</span></div>`,
        generated: `<div class="ev"><span class="st ok">${ico("check")}</span>
          <div class="body"><div class="l1"><code>/generate</code><span class="t">just now · 3m 04s</span></div></div>
          <span class="view">View</span></div>`,
        failed: `<div class="ev err"><span class="st" style="color:var(--err)">${ico("alert")}</span>
          <div class="body"><div class="l1"><code>/upscale</code><span class="t">just now</span></div>
          <div class="l2">CUDA out of memory</div></div>
          <span class="view">Retry</span></div>`,
      };
      const sec = (title, n, rows, all) =>
        `<div class="sec"><div class="sec-h">${title}${n ? `<span class="n">${n}</span>` : ""}${all ? `<span class="all">${all}</span>` : ""}</div>${rows.map((r) => EV[r]).join("")}</div>`;
      const MI = {
        api: `<div class="mi">${ico("code")}Use via API or MCP</div>`,
        runs: `<div class="mi">${ico("history")}Runs<span class="r">14</span></div>`,
        settings: `<div class="mi">${ico("gear")}Settings</div>`,
      };
      const menu = (items) =>
        `<div class="menu">${items.map((i) => MI[i]).join("")}</div>`;
      const foot = `<div class="pop-foot">${ico("logo", "logo")}Built with Gradio<span class="r">gradio.app ↗</span></div>`;
      const last = `<div class="last"><div class="l1"><span class="ok" style="display:flex">${ico("check")}</span><code>/generate</code>· 3m 04s · just now</div>
        <div class="ttl">Run this from code or an agent</div>
        <div class="chips"><span>Python</span><span>JS</span><span>cURL</span><span>${ico("bot")}MCP</span></div></div>`;
      const ALL = ["api", "runs", "settings"];

      const POPS = {
        idle: () => `<div class="pop">${menu(ALL)}${foot}</div>`,
        running: () =>
          `<div class="pop">${sec("Running", 2, ["generate", "upscale"])}${sec("Finished", 0, ["caption"], "All runs →")}${menu(ALL)}${foot}</div>`,
        restored: () =>
          `<div class="pop"><div class="banner">${ico("refresh")}Picked up where you left off · 2 still running</div>${sec("Running", 2, ["generate", "upscale"])}${sec("Finished", 0, ["caption"], "All runs →")}${menu(ALL)}${foot}</div>`,
        failed: () =>
          `<div class="pop">${sec("Needs attention", 0, ["failed"])}${sec("Finished", 0, ["generated", "caption"], "All runs →")}${menu(ALL)}${foot}</div>`,
        last: () =>
          `<div class="pop">${last}${sec("Finished", 0, ["generated", "caption"], "All runs →")}${menu(ALL)}${foot}</div>`,
        code: () =>
          `<div class="pop wide"><div class="pop-head"><span class="back">${ico("back")}</span>Run this from code or an agent<span class="x">×</span></div>
           <div class="pad"><div class="meta"><span class="ok" style="display:flex">${ico("check")}</span>Ran <code>/generate</code>· 3m 04s · just now</div>
           <div class="tabs"><span class="on">Python</span><span>JavaScript</span><span>cURL</span><span>${ico("bot")}MCP</span></div>
<pre class="code"><span class="k">from</span> gradio_client <span class="k">import</span> Client

client = Client(<span class="s">"gradio/video-generator"</span>)
result = client.<span class="f">predict</span>(
    prompt=<span class="s">"A jellyfish drifting through…"</span>,
    length=<span class="s">"8 seconds"</span>,
    api_name=<span class="s">"/generate"</span>,
)<span class="copy">${ico("copy")}Copy</span></pre>
           <div class="panel-foot"><span>Uses your inputs from this run</span><a>Full API docs →</a></div></div></div>`,
        server: () =>
          `<div class="pop">${sec("Running", 1, ["generate"])}${menu(["api", "runs"])}${foot}</div>`,
        sheet: () =>
          `<div class="scrim"></div><div class="pop sheet">${sec("Running", 2, ["generate", "upscale"])}${menu(ALL)}${foot}</div>`,
      };

      function win(s, dark) {
        const cls = ["window", "theme"];
        if (dark) cls.push("dark");
        if (s.phone) cls.push("phone");
        return `<div class="${cls.join(" ")}">
          <div class="chrome"><i></i><i></i><i></i><div class="url">${s.url || "localhost:7860"}</div></div>
          ${s.custom ? custom : app(s.app || "idle", s.phone)}
          ${s.pop ? POPS[s.pop]() : ""}
          ${s.pop === "sheet" ? "" : fab(s.fab)}
        </div>`;
      }

      const peekDone = {
        html: `<span class="ok" style="display:flex">${ico("check")}</span><code>/generate</code><span class="sub">finished · 3m 04s</span><span class="go">View</span>`,
      };
      const peekCode = {
        hot: true,
        html: `Run <code>/generate</code> from code ${ico("arrow")}`,
      };

      const BOARDS = [
        {
          id: "launcher-e",
          tag: "Option E",
          title: "Corner launcher",
          desc: "The footer becomes the Gradio logo in a circle, bottom right. It counts what's running and expands upwards.",
          states: [
            {
              label: "Idle",
              note: "No footer strip. The page gets its last row back; the logo is the only chrome.",
              fab: {},
            },
            {
              label: "Events running",
              note: "The badge counts this session's running and queued events. The ring turns while any of them is in progress.",
              app: "gen",
              fab: { ring: true, running: 2 },
            },
            {
              label: "Opened: expands upwards",
              note: "Events on top, with progress, queue position and stop. The old footer links sit below, and attribution is the last row.",
              app: "gen",
              pop: "running",
              fab: { open: true, ring: true, running: 2 },
            },
          ],
        },
        {
          id: "launcher-sessions",
          tag: "Option E · sessions",
          title: "Events that outlive the page",
          desc: "Sessions keep their running jobs across refreshes and restarts (#13585). The launcher is where they stay visible.",
          states: [
            {
              label: "Back after a refresh",
              note: "The session is restored and the launcher opens once to say so. The same two events are still there, with their real elapsed time.",
              app: "gen",
              pop: "restored",
              fab: { open: true, ring: true, running: 2 },
            },
            {
              label: "Finished while you were elsewhere",
              note: "The circle grows sideways for a few seconds, then shrinks back to a green check until the result has been seen.",
              app: "done",
              fab: { peek: peekDone },
            },
            {
              label: "An event failed",
              note: "A red badge replaces the count. The error is listed first, with a retry that reuses the same inputs.",
              app: "done",
              pop: "failed",
              fab: { open: true, badge: "err" },
            },
          ],
        },
        {
          id: "launcher-agent",
          tag: "Option E · agent flow",
          title: "From a run to code, in the same place",
          desc: "Keeps the entry point from #13916: option B's post-run segment becomes a peek, and C's copy chips live in the panel.",
          states: [
            {
              label: "After a run",
              note: "The same sideways peek, in orange. It stays until the next run or until it is dismissed, so it isn't missed.",
              app: "done",
              fab: { peek: peekCode },
            },
            {
              label: "Opened",
              note: "The last run is the first card. A chip copies that exact call in one click; the card title opens the full snippet.",
              app: "done",
              pop: "last",
              fab: { open: true },
            },
            {
              label: "Code for this run",
              note: "The panel widens in place, with the same tabs as option B. Back returns to the event list.",
              app: "done",
              pop: "code",
              fab: { open: true },
            },
          ],
        },
        {
          id: "launcher-dark",
          tag: "Option E · dark",
          title: "Corner launcher in dark mode",
          desc: "Same tokens, mapped to the dark theme.",
          dark: true,
          states: [
            {
              label: "Events running",
              app: "gen",
              fab: { ring: true, running: 2 },
            },
            {
              label: "Opened",
              app: "gen",
              pop: "running",
              fab: { open: true, ring: true, running: 2 },
            },
            { label: "After a run", app: "done", fab: { peek: peekCode } },
          ],
        },
        {
          id: "launcher-server",
          tag: "gr.Server · phone",
          title: "On a custom frontend, and on a small screen",
          desc: "Injected as <gradio-footer> (#14088). It floats over the page instead of adding a row to a layout we don't control.",
          states: [
            {
              label: "gr.Server: closed",
              note: "Nothing is appended to the page's flow, so full-height layouts are left alone.",
              custom: true,
              url: "localhost:7860",
              fab: { ring: true, running: 1 },
            },
            {
              label: "gr.Server: opened",
              note: "Only the rows that work outside Blocks. Events come from the queue, so they show up for any frontend that uses the client.",
              custom: true,
              pop: "server",
              fab: { open: true, ring: true, running: 1 },
            },
            {
              label: "Phone: bottom sheet",
              note: "Under about 480px the panel opens as a sheet.",
              phone: true,
              app: "gen",
              pop: "sheet",
            },
          ],
        },
      ];

      const TILES = [
        ["Idle", "Just the logo.", {}],
        [
          "Running",
          "Count of running and queued events, with a turning ring.",
          { ring: true, running: 1 },
        ],
        [
          "Several",
          "The count is the session's, across every page of the app.",
          { ring: true, running: 3 },
        ],
        [
          "Queued only",
          "Hollow badge and no ring: nothing has started yet.",
          { badge: "queued", n: 2 },
        ],
        [
          "Finished, unseen",
          "Stays until the panel is opened or the output is on screen.",
          { badge: "done" },
        ],
        ["Failed", "Takes priority over the count.", { badge: "err" }],
        [
          "Reconnecting",
          "Greyed out while the connection is lost; events keep running on the server.",
          { off: true },
        ],
      ];

      let html = `<section class="board" id="launcher-states">
        <div class="board-head"><span class="tag">Option E · badge</span><h2>What the circle can say</h2>
        <p>One glance tells you whether anything in your session is running, done or broken.</p></div>
        <div class="tiles">${TILES.map(
          ([t, d, f]) =>
            `<div class="tile"><div class="stage theme">${fab({ ...f, static: true })}</div><div><b>${t}</b><span>${d}</span></div></div>`,
        ).join("")}</div></section>`;

      for (const b of BOARDS) {
        html += `<section class="board${b.dark ? " dark-board" : ""}" id="${b.id}">
          <div class="board-head"><span class="tag">${b.tag}</span><h2>${b.title}</h2><p>${b.desc.replace(/</g, "&lt;")}</p></div>
          <div class="states">${b.states
            .map(
              (s, i) =>
                `<div class="state"><div class="state-label"><b>${i + 1}</b> ${s.label}</div>${win(s, b.dark)}${s.note ? `<p class="state-note" style="width:${s.phone ? 300 : 560}px">${s.note}</p>` : ""}</div>`,
            )
            .join("")}</div></section>`;
      }
      const SHAPES = [
        ["circle", "Circle", "Today's launcher. Reads as a chat widget."],
        [
          "squircle",
          "Rounded square",
          "An app icon. Same footprint, no chat-bubble echo.",
        ],
        [
          "tab",
          "Corner tab",
          "Docked into the corner, part of the page frame. Progress runs along its top edge.",
        ],
        [
          "diamond",
          "Diamond",
          "The rhombus of the Gradio mark. The most branded, the least like anything else.",
        ],
      ];
      const params = new URLSearchParams(location.search);
      const shape = params.get("shape");
      if (shape) {
        document.body.classList.add(`shape-${shape}`);
        const word = {
          squircle: "a rounded square",
          tab: "a tab docked in the corner",
          diamond: "a diamond",
        }[shape];
        html = html
          .replace(/in a circle/g, `in ${word}`)
          .replace(/the circle/gi, "the launcher");
      }
      if (params.get("board") === "shapes") {
        html = `<section class="board" id="launcher-shapes">
          <div class="board-head"><span class="tag">Option E · shapes</span><h2>Shapes for the launcher</h2>
          <p>Every state, in each outline. The ring and badges follow the shape.</p></div>
          ${SHAPES.map(
            ([k, name, d]) =>
              `<div class="shape-row shape-${k}"><div class="shape-name"><b>${name}</b><span>${d}</span></div><div class="tiles">${TILES.map(
                ([t, , f], i) =>
                  `<div class="tile"><div class="stage theme">${fab({ ...f, static: true })}</div>${k === "circle" ? `<div><b>${t}</b></div>` : ""}</div>`,
              ).join("")}</div></div>`,
          ).join("")}</section>`;
      }
      document.getElementById("boards").innerHTML = html;
    </script>
  </body>
</html>
